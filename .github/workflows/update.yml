name: 更新数据并发布网页

on:
  schedule:
    # 周一至周五每小时一次（UTC），覆盖亚洲、欧洲、美洲交易时段；A 股收盘后的那一轮会生成 DeepSeek 研判
    - cron: "7 * * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "全部重新抓取（1 = 是）"
        default: "0"

permissions:
  contents: write   # 每周提交一次 last-run.txt，避免公开仓库 60 天无活动后定时任务被 GitHub 停用
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 恢复上一次的数据缓存
        uses: actions/cache/restore@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: 抓取数据并生成网页
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FORCE: ${{ github.event.inputs.force || '0' }}
        run: python scripts/build.py

      - name: 保存数据缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: data-${{ github.run_id }}

      - name: 保活提交（每周一次）
        if: github.event_name == 'schedule'
        run: |
          last=$(cat last-run.txt 2>/dev/null | head -c 10)
          if [ -z "$last" ] || [ $(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 )) -ge 7 ]; then
            date -u +%Y-%m-%dT%H:%MZ > last-run.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last-run.txt && git commit -m "keepalive: weekly scheduled run" && git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
