name: 更新数据并发布网页

on:
  schedule:
    # 周一至周五每小时第 37 分钟（UTC，避开整点高峰），覆盖亚洲、欧洲、美洲交易时段；北京时间 15:37 那一轮会生成精选名单、资金监控和 DeepSeek 研判
    - cron: "37 * * * 1-5"
    # GitHub 高峰期会跳过定时任务：A 股收盘后（北京时间 15:52–17:52）再加几轮，当天已经生成过的不会重复生成
    - cron: "12,52 7-9 * * 1-5"
    # A 股盘前分析：北京时间周一至周五 07:33–09:13 每 5 分钟排一轮。GitHub 高峰期大部分轮次会被跳过（最近两周只有约六分之一真正运行），所以要多排；
    # 分析当天只生成一次，休市日不生成，其余轮次就是普通的数据更新。星期按 UTC 算：北京时间周一 07:33 是 UTC 周日 23:33，所以 23 点这一行是 0-4
    - cron: "33/5 23 * * 0-4"
    - cron: "3/5 0 * * 1-5"
    - cron: "3,8,13 1 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "全部重新抓取（1 = 是）"
        default: "0"
      only:
        description: "只跑这些任务（逗号分隔，如 picks,flow,ai,premarket,lab,quant_ext；留空 = 按时间表）"
        default: ""
      review:
        description: "重新生成 AI 大盘复盘（1 = 是）"
        default: "0"
      kronos:
        description: "重新生成 AI K 线预测（1 = 是）"
        default: "0"

permissions:
  contents: write   # 每周提交一次 last-run.txt，避免公开仓库 60 天无活动后定时任务被 GitHub 停用
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
          cache: pip

      - run: |
          pip install --use-pep517 -r requirements.txt
          pip install --no-deps "openbb==5.0.0"   # OpenBB 主包只提供 obb 入口；扩展只装 requirements.txt 里用到的那几个

      - name: 安装 stock-api（Node.js 行情库，量化页用）
        run: npm install -g --no-audit --no-fund stock-api || echo "stock-api 安装失败，量化页的这一项会标成失败"

      - name: 恢复上一次的数据缓存
        uses: actions/cache/restore@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: 抓取数据并生成网页
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WENCAI_COOKIE: ${{ secrets.WENCAI_COOKIE }}     # 可选：你自己的问财 cookie，设了才跑问财预设选股
          FORCE: ${{ github.event.inputs.force || '0' }}
          ONLY: ${{ github.event.inputs.only || '' }}
        run: python scripts/build.py

      # AI 大盘复盘：开源项目 daily_stock_analysis（https://github.com/ZhuLinsen/daily_stock_analysis），模型用 DeepSeek。
      # 它锁定旧版 akshare（< 1.20），和本仓库冲突，所以单独装在 dsa/.venv（缓存起来，固定在下面这个版本），每个交易日收盘后跑一次。
      - name: AI 大盘复盘要不要生成
        id: review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FORCE_REVIEW: ${{ github.event.inputs.review || '0' }}
        run: echo "due=$(python scripts/quant.py due)" >> "$GITHUB_OUTPUT"

      - name: 恢复 daily_stock_analysis 环境
        if: steps.review.outputs.due == 'true'
        uses: actions/cache@v4
        with:
          path: dsa
          key: dsa-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-f044e95f2156d6c53cdeabf4bf27c60df4e366d5

      - name: 安装 daily_stock_analysis
        if: steps.review.outputs.due == 'true'
        run: |
          if [ ! -x dsa/.venv/bin/python ]; then
            rm -rf dsa && git init -q dsa
            git -C dsa fetch -q --depth 1 https://github.com/ZhuLinsen/daily_stock_analysis.git f044e95f2156d6c53cdeabf4bf27c60df4e366d5
            git -C dsa checkout -q FETCH_HEAD
            python -m venv dsa/.venv && dsa/.venv/bin/pip install -q -r dsa/requirements.txt
          fi

      - name: 生成 AI 大盘复盘
        if: steps.review.outputs.due == 'true'
        continue-on-error: true
        working-directory: dsa
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TZ: Asia/Shanghai
          MARKET_REVIEW_REGION: cn
          MARKET_REVIEW_COLOR_SCHEME: red_up
          REPORT_LANGUAGE: zh
        run: |
          rm -f reports/market_review_*.md
          timeout 900 .venv/bin/python ../scripts/dsa_run.py ../data/a.json --market-review --no-notify --force-run
          cd .. && python scripts/quant.py import "dsa/reports/market_review_*.md" && python scripts/gen.py

      # AI K 线预测：开源金融 K 线大模型 Kronos（https://github.com/shiyu-coder/Kronos，MIT 许可证），每个交易日收盘后跑一次（CPU，约 3–5 分钟）。
      # 代码固定在下面这个提交，模型权重（safetensors）固定在 scripts/kronos_fc.py 里写的版本；PyTorch 只装 CPU 版，只在要预测的那一轮装。
      - name: AI K 线预测要不要生成
        id: kronos
        env:
          FORCE_KRONOS: ${{ github.event.inputs.kronos || '0' }}
        run: echo "due=$(python scripts/kronos_fc.py due)" >> "$GITHUB_OUTPUT"

      - name: 恢复 Kronos 代码和模型
        if: steps.kronos.outputs.due == 'true'
        uses: actions/cache@v4
        with:
          path: kronos
          key: kronos-67b630e67f6a18c9e9be918d9b4337c960db1e9a-901c26c-0e01173

      - name: 生成 AI K 线预测
        if: steps.kronos.outputs.due == 'true'
        continue-on-error: true
        env:
          HF_HOME: ${{ github.workspace }}/kronos/hf
          PYTHONPATH: ${{ github.workspace }}/kronos/repo
        run: |
          if [ ! -f kronos/repo/model/kronos.py ]; then
            rm -rf kronos/repo && git init -q kronos/repo
            git -C kronos/repo fetch -q --depth 1 https://github.com/shiyu-coder/Kronos.git 67b630e67f6a18c9e9be918d9b4337c960db1e9a
            git -C kronos/repo checkout -q FETCH_HEAD
          fi
          pip install -q --index-url https://download.pytorch.org/whl/cpu "torch==2.15.0"
          pip install -q "einops==0.8.2" "safetensors==0.8.0" "huggingface_hub==0.36.2"
          timeout 1800 python scripts/kronos_fc.py run && python scripts/gen.py

      - name: 保存数据缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: data-${{ github.run_id }}

      - name: 保活提交（每周一次）
        if: github.event_name == 'schedule'
        run: |
          last=$(cat last-run.txt 2>/dev/null | head -c 10)
          if [ -z "$last" ] || [ $(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 )) -ge 7 ]; then
            date -u +%Y-%m-%dT%H:%MZ > last-run.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last-run.txt && git commit -m "keepalive: weekly scheduled run" && git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
